[project]
name = "hopwatch"
version = "0.3.0"
description = "Find and book Wizz Air Multipass itineraries, including self-transfer routings"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Layer 3: the logged-in availability checker and booking flow.
browser = [
    "playwright>=1.44",
]
# Layer 4 interfaces.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
discord = [
    "discord.py>=2.3",
]
# The AWS backend: DynamoDB for state, SQS for the job queue.
aws = [
    "boto3>=1.34",
]
# The CDK stacks in infra/.
infra = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.0",
]
# Everything needed to run `hopwatch serve`.
service = [
    "hopwatch[browser,web,discord]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "boto3>=1.34",
    "moto[server]>=5.0",
]

[project.scripts]
hopwatch = "hopwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hopwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
